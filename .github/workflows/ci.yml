name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Run unit tests
        run: mvn -B -q test

      - name: Package
        run: mvn -B -q package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oms-jar
          path: target/cross-border-logistics-oms-*.jar
