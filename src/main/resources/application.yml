server:
  port: 8080

spring:
  application:
    name: cross-border-logistics-oms
  profiles:
    active: mysql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# JWT 配置（secret 至少 32 字节）
jwt:
  secret: "CrossBorder-Logistics-OMS-2026-Jwt-Secret-Key-0123456789"
  expire-minutes: 720

app:
  cache:
    # true=Redis 缓存价卡；false=进程内缓存（H2 快速演示模式）
    redis: true
    default-ttl-seconds: 3600

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn
