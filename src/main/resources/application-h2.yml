# H2 内存快速演示模式：无需 MySQL / Redis，一条命令启动
# 启动：java -jar xxx.jar --spring.profiles.active=h2
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:oms;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/h2/schema.sql
      data-locations: classpath:sql/h2/data.sql

app:
  cache:
    redis: false
