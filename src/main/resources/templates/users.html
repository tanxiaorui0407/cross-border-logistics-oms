<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户管理 - 跨境物流订单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-page="users">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">跨境物流 OMS</a>
        <ul class="navbar-nav me-auto" id="navLinks"></ul>
        <div id="navUser"></div>
    </div>
</nav>
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">用户管理（RBAC）</h5>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#userModal">新增用户</button>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr><th>ID</th><th>用户名</th><th>角色</th><th>关联客户</th><th>状态</th><th>创建时间</th><th>操作</th></tr>
            </thead>
            <tbody id="userBody"></tbody>
        </table>
    </div>
    <div class="d-flex justify-content-between align-items-center">
        <span class="text-muted small" id="pageInfo"></span>
        <div><button class="btn btn-sm btn-outline-secondary" id="prevPage">上一页</button>
            <button class="btn btn-sm btn-outline-secondary" id="nextPage">下一页</button></div>
    </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="userModalTitle">新增用户</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="uId">
                <div class="mb-2"><label class="form-label">用户名</label><input class="form-control" id="uUsername"></div>
                <div class="mb-2" id="pwdWrap"><label class="form-label">密码（新增时必填）</label><input class="form-control" id="uPassword" type="password"></div>
                <div class="mb-2"><label class="form-label">角色</label>
                    <select class="form-select" id="uRole">
                        <option value="ADMIN">ADMIN 管理员</option>
                        <option value="OPS">OPS 操作员</option>
                        <option value="CUSTOMER">CUSTOMER 客户</option>
                    </select></div>
                <div class="mb-2"><label class="form-label">关联客户（CUSTOMER 必填）</label>
                    <select class="form-select" id="uCustomer"></select></div>
                <div class="mb-2"><label class="form-label">状态</label>
                    <select class="form-select" id="uStatus">
                        <option value="1">启用</option><option value="0">禁用</option>
                    </select></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary" id="btnResetPwd" style="margin-right:auto;">重置密码为 123456</button>
                <button class="btn btn-primary" id="btnSaveUser">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    $(function () {
        if (!requireLogin() || getUser().role !== 'ADMIN') { location.href = '/'; return; }
        let current = 1, totalPages = 1, editingId = null;

        function loadCustomers() {
            apiGet('/api/customers').done(function (res) {
                if (res.code !== 0) return;
                let html = '<option value="">--</option>';
                res.data.forEach(c => { html += `<option value="${c.id}">${c.companyName} (${c.customerCode})</option>`; });
                $('#uCustomer').html(html);
            });
        }

        function loadUsers() {
            apiGet('/api/admin/users', { page: current, size: 10 }).done(function (res) {
                if (res.code !== 0) { alert(res.msg); return; }
                const data = res.data;
                let html = '';
                (data.records || []).forEach(u => {
                    html += `<tr>
                        <td>${u.id}</td><td>${u.username}</td>
                        <td><span class="badge bg-secondary">${u.role}</span></td>
                        <td>${u.customerName || '-'}</td>
                        <td>${u.status === 1 ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-danger">禁用</span>'}</td>
                        <td>${fmtTime(u.createdAt)}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="editUser(${u.id})">编辑</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="delUser(${u.id})">删除</button>
                        </td></tr>`;
                });
                $('#userBody').html(html || '<tr><td colspan="7" class="text-center text-muted">暂无用户</td></tr>');
                totalPages = data.pages || 1;
                $('#pageInfo').text(`共 ${data.total} 条 / 第 ${data.current} 页`);
                $('#prevPage').prop('disabled', data.current <= 1);
                $('#nextPage').prop('disabled', data.current >= totalPages);
            });
        }

        window.editUser = function (id) {
            apiGet('/api/admin/users', { page: 1, size: 100 }).done(function (res) {
                const u = (res.data.records || []).find(x => x.id === id);
                if (!u) return;
                editingId = id;
                $('#uId').val(id);
                $('#uUsername').val(u.username).prop('disabled', true);
                $('#uPassword').val('');
                $('#pwdWrap').addClass('d-none');
                $('#uRole').val(u.role);
                $('#uCustomer').val(u.customerId || '');
                $('#uStatus').val(String(u.status));
                $('#userModalTitle').text('编辑用户');
                $('#btnResetPwd').show();
                new bootstrap.Modal($('#userModal')[0]).show();
            });
        };
        window.delUser = function (id) {
            if (!confirm('确认删除该用户？')) return;
            $.ajax({ url: '/api/admin/users/' + id, method: 'DELETE' }).done(function (res) {
                if (res.code === 0) { showToast('已删除', 'success'); loadUsers(); } else { alert(res.msg); }
            });
        };

        $('#userModal').on('show.bs.modal', function () {
            if (!editingId) {
                $('#uId').val(''); $('#uUsername').val('').prop('disabled', false);
                $('#uPassword').val(''); $('#pwdWrap').removeClass('d-none');
                $('#uRole').val('OPS'); $('#uCustomer').val(''); $('#uStatus').val('1');
                $('#userModalTitle').text('新增用户');
                $('#btnResetPwd').hide();
            }
        });
        $('#userModal').on('hidden.bs.modal', function () { editingId = null; });

        $('#btnSaveUser').on('click', function () {
            const id = $('#uId').val();
            const body = {
                username: $('#uUsername').val().trim(),
                password: $('#uPassword').val(),
                role: $('#uRole').val(),
                customerId: $('#uRole').val() === 'CUSTOMER' && $('#uCustomer').val() ? Number($('#uCustomer').val()) : null,
                status: Number($('#uStatus').val())
            };
            if (!body.username || (!id && !body.password)) { alert('用户名/密码不能为空'); return; }
            const url = id ? '/api/admin/users/' + id : '/api/admin/users';
            $.ajax({
                url: url, method: id ? 'PUT' : 'POST',
                contentType: 'application/json;charset=UTF-8',
                data: JSON.stringify(body), dataType: 'json'
            }).done(function (res) {
                if (res.code === 0) { showToast('保存成功', 'success'); $('#userModal').modal('hide'); loadUsers(); }
                else { alert(res.msg); }
            });
        });

        $('#btnResetPwd').on('click', function () {
            const id = $('#uId').val();
            if (!id) return;
            apiPost('/api/admin/users/' + id + '/password', { password: '123456' }).done(function (res) {
                if (res.code === 0) { showToast('密码已重置为 123456', 'success'); } else { alert(res.msg); }
            });
        });

        $('#prevPage').on('click', function () { if (current > 1) { current--; loadUsers(); } });
        $('#nextPage').on('click', function () { if (current < totalPages) { current++; loadUsers(); } });

        loadCustomers();
        loadUsers();
    });
</script>
</body>
</html>
