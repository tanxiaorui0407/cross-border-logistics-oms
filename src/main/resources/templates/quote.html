<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>运费试算 - 跨境物流订单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-page="quote">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">跨境物流 OMS</a>
        <ul class="navbar-nav me-auto" id="navLinks"></ul>
        <div id="navUser"></div>
    </div>
</nav>
<div class="container py-4" style="max-width:900px;">
    <h5 class="mb-3">运费试算 · 多渠道比价</h5>
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3"><label class="form-label">目的国</label>
                    <select class="form-select" id="country">
                        <option value="US">美国 US</option><option value="GB">英国 GB</option>
                        <option value="DE">德国 DE</option><option value="FR">法国 FR</option>
                    </select></div>
                <div class="col-md-3"><label class="form-label">实重kg *</label>
                    <input class="form-control" id="weight" type="number" step="0.001" value="1.0"></div>
                <div class="col-md-2"><label class="form-label">长cm</label><input class="form-control" id="len" type="number" step="0.1"></div>
                <div class="col-md-2"><label class="form-label">宽cm</label><input class="form-control" id="wid" type="number" step="0.1"></div>
                <div class="col-md-2"><label class="form-label">高cm</label><input class="form-control" id="hei" type="number" step="0.1"></div>
            </div>
            <button class="btn btn-primary mt-3" id="btnCalc">开始比价</button>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr><th>渠道</th><th>类型</th><th>时效</th><th>体积重</th><th>计费重</th><th>运费</th><th>推荐</th></tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    $(function () {
        if (!requireLogin()) return;
        $('#btnCalc').on('click', function () {
            const data = {
                destCountry: $('#country').val(),
                actualWeight: $('#weight').val(),
                lengthCm: $('#len').val() || null,
                widthCm: $('#wid').val() || null,
                heightCm: $('#hei').val() || null
            };
            if (!data.actualWeight) { alert('请填写实重'); return; }
            apiPost('/api/quote/preview', data).done(function (res) {
                if (res.code !== 0) { alert(res.msg); return; }
                let html = '';
                res.data.forEach((q, i) => {
                    html += `<tr>
                        <td class="fw-semibold">${q.channelName}</td><td>${q.transportType}</td>
                        <td>${q.etaDays} 天</td>
                        <td>${q.volWeight != null ? q.volWeight + ' kg' : '-'}</td>
                        <td>${q.billableWeight} kg</td>
                        <td class="fw-bold">${fmtMoney(q.freight)} ${q.currency}</td>
                        <td>${i === 0 ? '<span class="badge bg-success">最低价</span>' : ''}</td></tr>`;
                });
                $('#resultBody').html(html || '<tr><td colspan="7" class="text-center text-muted">所选目的国暂无可用价卡</td></tr>');
            });
        });
        $('#btnCalc').trigger('click');
    });
</script>
</body>
</html>
