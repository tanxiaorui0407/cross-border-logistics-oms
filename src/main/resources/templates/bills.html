<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>账单对账 - 跨境物流订单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-page="bills">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">跨境物流 OMS</a>
        <ul class="navbar-nav me-auto" id="navLinks"></ul>
        <div id="navUser"></div>
    </div>
</nav>
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">账单对账</h5>
        <div id="genWrap" class="d-none">
            <select class="form-select form-select-sm d-inline-block me-2" id="gCustomer" style="width:200px"></select>
            <input type="month" class="form-control form-control-sm d-inline-block me-2" id="gPeriod" style="width:150px">
            <button class="btn btn-primary btn-sm" id="btnGenerate">生成账单</button>
        </div>
    </div>
    <div class="card mb-3">
        <div class="card-body py-2">
            <form class="row g-2 align-items-end" id="filterForm">
                <div class="col-auto" id="billCustomerWrap">
                    <label class="form-label small mb-0">客户</label>
                    <select class="form-select form-select-sm" id="fCustomer"><option value="">全部</option></select>
                </div>
                <div class="col-auto"><label class="form-label small mb-0">账期</label>
                    <input type="month" class="form-control form-control-sm" id="fPeriod"></div>
                <div class="col-auto"><button class="btn btn-sm btn-primary" type="submit">查询</button></div>
            </form>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr><th>账单号</th><th>客户</th><th>账期</th><th>金额</th><th>状态</th><th>创建时间</th><th>操作</th></tr>
            </thead>
            <tbody id="billBody"></tbody>
        </table>
    </div>
    <div class="d-flex justify-content-between align-items-center">
        <span class="text-muted small" id="pageInfo"></span>
        <div><button class="btn btn-sm btn-outline-secondary" id="prevPage">上一页</button>
            <button class="btn btn-sm btn-outline-secondary" id="nextPage">下一页</button></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    $(function () {
        if (!requireLogin()) return;
        const user = getUser();
        let current = 1, totalPages = 1;

        function loadCustomers() {
            apiGet('/api/customers').done(function (res) {
                if (res.code !== 0) return;
                let html = '';
                res.data.forEach(c => { html += `<option value="${c.id}">${c.companyName}</option>`; });
                $('#gCustomer').html(html);
                if (user.role === 'CUSTOMER') {
                    $('#genWrap').addClass('d-none');
                    $('#billCustomerWrap').hide();
                } else {
                    $('#genWrap').removeClass('d-none');
                    let fh = '<option value="">全部</option>';
                    res.data.forEach(c => { fh += `<option value="${c.id}">${c.companyName}</option>`; });
                    $('#fCustomer').html(fh);
                }
                $('#gPeriod').val(new Date().toISOString().slice(0, 7));
            });
        }

        function loadBills() {
            const params = { page: current, size: 10 };
            if ($('#fCustomer').val() && user.role !== 'CUSTOMER') params.customerId = $('#fCustomer').val();
            if ($('#fPeriod').val()) params.period = $('#fPeriod').val();
            apiGet('/api/bills', params).done(function (res) {
                if (res.code !== 0) { alert(res.msg); return; }
                const data = res.data;
                let html = '';
                (data.records || []).forEach(b => {
                    html += `<tr>
                        <td>${b.billNo}</td><td>${b.customerName || '-'}</td><td>${b.period}</td>
                        <td class="fw-bold">${fmtMoney(b.totalAmount)} ${b.currency}</td>
                        <td><span class="badge bg-${statusClass(b.status)}">${statusLabel(b.status)}</span></td>
                        <td>${fmtTime(b.createdAt)}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="exportBill(${b.id})">导出</button>
                            ${(user.role === 'ADMIN' || user.role === 'OPS') && b.status === 'OPEN' ? `<button class="btn btn-sm btn-outline-success ms-1" onclick="markPaid(${b.id})">标记已付</button>` : ''}
                        </td></tr>`;
                });
                $('#billBody').html(html || '<tr><td colspan="7" class="text-center text-muted">暂无账单</td></tr>');
                totalPages = data.pages || 1;
                $('#pageInfo').text(`共 ${data.total} 条 / 第 ${data.current} 页`);
                $('#prevPage').prop('disabled', data.current <= 1);
                $('#nextPage').prop('disabled', data.current >= totalPages);
            });
        }

        window.exportBill = function (id) { downloadAuth('/api/bills/' + id + '/export', '账单_' + id + '.xlsx'); };
        window.markPaid = function (id) {
            if (!confirm('确认标记该账单已支付？')) return;
            apiPost('/api/bills/' + id + '/paid').done(function (res) {
                if (res.code === 0) { showToast('已标记', 'success'); loadBills(); } else { alert(res.msg); }
            });
        };

        $('#btnGenerate').on('click', function () {
            const period = $('#gPeriod').val();
            if (!period) { alert('请选择账期'); return; }
            apiPost('/api/bills/generate', { customerId: Number($('#gCustomer').val()), period: period })
                .done(function (res) {
                    if (res.code === 0) { showToast('账单已生成：' + res.data.billNo, 'success'); loadBills(); }
                    else { alert(res.msg); }
                }).fail(function (xhr) {
                    const r = xhr.responseJSON; alert(r && r.msg ? r.msg : '生成失败');
                });
        });
        $('#filterForm').on('submit', function (e) { e.preventDefault(); current = 1; loadBills(); });
        $('#prevPage').on('click', function () { if (current > 1) { current--; loadBills(); } });
        $('#nextPage').on('click', function () { if (current < totalPages) { current++; loadBills(); } });

        loadCustomers();
        loadBills();
    });
</script>
</body>
</html>
