<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>客户管理 - 跨境物流订单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-page="customers">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">跨境物流 OMS</a>
        <ul class="navbar-nav me-auto" id="navLinks"></ul>
        <div id="navUser"></div>
    </div>
</nav>
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">客户管理</h5>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#cModal">新增客户</button>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr><th>ID</th><th>客户编码</th><th>公司名</th><th>联系人</th><th>国家</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="cBody"></tbody>
        </table>
    </div>
    <div class="d-flex justify-content-between align-items-center">
        <span class="text-muted small" id="pageInfo"></span>
        <div><button class="btn btn-sm btn-outline-secondary" id="prevPage">上一页</button>
            <button class="btn btn-sm btn-outline-secondary" id="nextPage">下一页</button></div>
    </div>
</div>

<div class="modal fade" id="cModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="cModalTitle">新增客户</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="cId">
                <div class="mb-2"><label class="form-label">客户编码</label><input class="form-control" id="cCode" placeholder="如 CUST003"></div>
                <div class="mb-2"><label class="form-label">公司名</label><input class="form-control" id="cName"></div>
                <div class="mb-2"><label class="form-label">联系人</label><input class="form-control" id="cContact"></div>
                <div class="mb-2"><label class="form-label">国家</label>
                    <select class="form-select" id="cCountry">
                        <option value="US">美国 US</option><option value="GB">英国 GB</option>
                        <option value="DE">德国 DE</option><option value="FR">法国 FR</option>
                        <option value="CN">中国 CN</option>
                    </select></div>
                <div class="mb-2"><label class="form-label">状态</label>
                    <select class="form-select" id="cStatus"><option value="1">启用</option><option value="0">停用</option></select></div>
            </div>
            <div class="modal-footer"><button class="btn btn-primary" id="btnSave">保存</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    $(function () {
        if (!requireLogin() || getUser().role !== 'ADMIN') { location.href = '/'; return; }
        let current = 1, totalPages = 1, editingId = null;

        function load() {
            apiGet('/api/admin/customers', { page: current, size: 10 }).done(function (res) {
                if (res.code !== 0) { alert(res.msg); return; }
                const data = res.data;
                let html = '';
                (data.records || []).forEach(c => {
                    html += `<tr>
                        <td>${c.id}</td><td>${c.customerCode}</td><td>${c.companyName}</td>
                        <td>${c.contact || '-'}</td><td>${c.country || '-'}</td>
                        <td>${c.status === 1 ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-danger">停用</span>'}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="editC(${c.id})">编辑</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="delC(${c.id})">删除</button>
                        </td></tr>`;
                });
                $('#cBody').html(html || '<tr><td colspan="7" class="text-center text-muted">暂无客户</td></tr>');
                totalPages = data.pages || 1;
                $('#pageInfo').text(`共 ${data.total} 条 / 第 ${data.current} 页`);
                $('#prevPage').prop('disabled', data.current <= 1);
                $('#nextPage').prop('disabled', data.current >= totalPages);
            });
        }

        window.editC = function (id) {
            apiGet('/api/admin/customers', { page: 1, size: 100 }).done(function (res) {
                const c = (res.data.records || []).find(x => x.id === id);
                if (!c) return;
                editingId = id;
                $('#cId').val(id); $('#cCode').val(c.customerCode).prop('disabled', true);
                $('#cName').val(c.companyName); $('#cContact').val(c.contact || '');
                $('#cCountry').val(c.country || 'US'); $('#cStatus').val(String(c.status));
                $('#cModalTitle').text('编辑客户');
                new bootstrap.Modal($('#cModal')[0]).show();
            });
        };
        window.delC = function (id) {
            if (!confirm('确认删除该客户？有订单的客户不可删除。')) return;
            $.ajax({ url: '/api/admin/customers/' + id, method: 'DELETE' }).done(function (res) {
                if (res.code === 0) { showToast('已删除', 'success'); load(); } else { alert(res.msg); }
            });
        };

        $('#cModal').on('show.bs.modal', function () {
            if (!editingId) {
                $('#cId').val(''); $('#cCode').val('').prop('disabled', false);
                $('#cName').val(''); $('#cContact').val(''); $('#cCountry').val('US'); $('#cStatus').val('1');
                $('#cModalTitle').text('新增客户');
            }
        });
        $('#cModal').on('hidden.bs.modal', function () { editingId = null; });

        $('#btnSave').on('click', function () {
            const id = $('#cId').val();
            const body = {
                customerCode: $('#cCode').val().trim(),
                companyName: $('#cName').val().trim(),
                contact: $('#cContact').val().trim(),
                country: $('#cCountry').val(),
                status: Number($('#cStatus').val())
            };
            if (!body.customerCode || !body.companyName) { alert('客户编码/公司名不能为空'); return; }
            const url = id ? '/api/admin/customers/' + id : '/api/admin/customers';
            $.ajax({
                url: url, method: id ? 'PUT' : 'POST',
                contentType: 'application/json;charset=UTF-8',
                data: JSON.stringify(body), dataType: 'json'
            }).done(function (res) {
                if (res.code === 0) { showToast('保存成功', 'success'); $('#cModal').modal('hide'); load(); }
                else { alert(res.msg); }
            });
        });

        $('#prevPage').on('click', function () { if (current > 1) { current--; load(); } });
        $('#nextPage').on('click', function () { if (current < totalPages) { current++; load(); } });
        load();
    });
</script>
</body>
</html>
