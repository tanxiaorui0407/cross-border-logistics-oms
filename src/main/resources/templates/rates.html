<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>价卡管理 - 跨境物流订单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-page="rates">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">跨境物流 OMS</a>
        <ul class="navbar-nav me-auto" id="navLinks"></ul>
        <div id="navUser"></div>
    </div>
</nav>
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">运价规则（价卡）</h5>
        <div>
            <select class="form-select form-select-sm d-inline-block me-2" id="chSelect" style="width:220px"></select>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#rModal">新增价卡</button>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr><th>ID</th><th>渠道</th><th>目的国</th><th>首重(kg)</th><th>首重价</th><th>续重(kg)</th><th>续重价</th><th>燃油%</th><th>挂号费</th><th>有效期</th><th>操作</th></tr>
            </thead>
            <tbody id="rBody"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="rModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="rModalTitle">新增价卡</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="rId">
                <div class="mb-2"><label class="form-label">目的国</label>
                    <select class="form-select" id="rCountry">
                        <option value="US">美国 US</option><option value="GB">英国 GB</option>
                        <option value="DE">德国 DE</option><option value="FR">法国 FR</option>
                    </select></div>
                <div class="row g-2 mb-2">
                    <div class="col-6"><label class="form-label">首重(kg)</label><input class="form-control" id="rFirstW" type="number" step="0.001" value="0.5"></div>
                    <div class="col-6"><label class="form-label">首重价</label><input class="form-control" id="rFirstP" type="number" step="0.01"></div>
                    <div class="col-6"><label class="form-label">续重(kg)</label><input class="form-control" id="rStepW" type="number" step="0.001" value="0.5"></div>
                    <div class="col-6"><label class="form-label">续重价</label><input class="form-control" id="rStepP" type="number" step="0.01"></div>
                    <div class="col-6"><label class="form-label">燃油费率%</label><input class="form-control" id="rFuel" type="number" step="0.01" value="0"></div>
                    <div class="col-6"><label class="form-label">挂号费</label><input class="form-control" id="rReg" type="number" step="0.01" value="0"></div>
                    <div class="col-6"><label class="form-label">生效日期</label><input type="date" class="form-control" id="rStart"></div>
                    <div class="col-6"><label class="form-label">失效日期</label><input type="date" class="form-control" id="rEnd"></div>
                </div>
            </div>
            <div class="modal-footer"><button class="btn btn-primary" id="btnSave">保存</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    $(function () {
        if (!requireLogin() || getUser().role !== 'ADMIN') { location.href = '/'; return; }
        let editingId = null, currentChannelId = null;

        function loadChannels() {
            apiGet('/api/admin/channels', { page: 1, size: 100 }).done(function (res) {
                if (res.code !== 0) return;
                let html = '';
                (res.data.records || []).forEach(c => {
                    html += `<option value="${c.id}">${c.channelName} (${c.channelCode})</option>`;
                });
                $('#chSelect').html(html);
                currentChannelId = Number($('#chSelect').val());
                loadRules();
            });
        }

        function loadRules() {
            if (!currentChannelId) return;
            apiGet('/api/admin/rate-rules/channel/' + currentChannelId).done(function (res) {
                if (res.code !== 0) { alert(res.msg); return; }
                let html = '';
                (res.data || []).forEach(r => {
                    html += `<tr>
                        <td>${r.id}</td><td>${currentChannelId}</td><td>${r.destCountry}</td>
                        <td>${r.firstWeight}</td><td>${r.firstPrice}</td>
                        <td>${r.stepWeight}</td><td>${r.stepPrice}</td>
                        <td>${r.fuelRate}</td><td>${r.regFee}</td>
                        <td>${r.effectiveDate} ~ ${r.expiredDate}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="editR(${r.id})">编辑</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="delR(${r.id})">删除</button>
                        </td></tr>`;
                });
                $('#rBody').html(html || '<tr><td colspan="11" class="text-center text-muted">该渠道暂无价卡</td></tr>');
            });
        }

        window.editR = function (id) {
            apiGet('/api/admin/rate-rules', { page: 1, size: 500, channelId: currentChannelId }).done(function (res) {
                const r = (res.data.records || []).find(x => x.id === id);
                if (!r) return;
                editingId = id;
                $('#rId').val(id); $('#rCountry').val(r.destCountry);
                $('#rFirstW').val(r.firstWeight); $('#rFirstP').val(r.firstPrice);
                $('#rStepW').val(r.stepWeight); $('#rStepP').val(r.stepPrice);
                $('#rFuel').val(r.fuelRate); $('#rReg').val(r.regFee);
                $('#rStart').val(r.effectiveDate); $('#rEnd').val(r.expiredDate);
                $('#rModalTitle').text('编辑价卡');
                new bootstrap.Modal($('#rModal')[0]).show();
            });
        };
        window.delR = function (id) {
            if (!confirm('确认删除该价卡？')) return;
            $.ajax({ url: '/api/admin/rate-rules/' + id, method: 'DELETE' }).done(function (res) {
                if (res.code === 0) { showToast('已删除', 'success'); loadRules(); } else { alert(res.msg); }
            });
        };

        $('#chSelect').on('change', function () { currentChannelId = Number($(this).val()); loadRules(); });

        $('#rModal').on('show.bs.modal', function () {
            if (!editingId) {
                $('#rId').val(''); $('#rCountry').val('US');
                $('#rFirstW').val(0.5); $('#rFirstP').val(''); $('#rStepW').val(0.5); $('#rStepP').val('');
                $('#rFuel').val(0); $('#rReg').val(0);
                $('#rStart').val(new Date().toISOString().slice(0, 10));
                $('#rEnd').val(new Date(new Date().setFullYear(new Date().getFullYear() + 1)).toISOString().slice(0, 10));
                $('#rModalTitle').text('新增价卡');
            }
        });
        $('#rModal').on('hidden.bs.modal', function () { editingId = null; });

        $('#btnSave').on('click', function () {
            const id = $('#rId').val();
            const body = {
                channelId: currentChannelId,
                destCountry: $('#rCountry').val(),
                firstWeight: Number($('#rFirstW').val()),
                firstPrice: Number($('#rFirstP').val()),
                stepWeight: Number($('#rStepW').val()),
                stepPrice: Number($('#rStepP').val()),
                fuelRate: Number($('#rFuel').val() || 0),
                regFee: Number($('#rReg').val() || 0),
                currency: 'USD',
                effectiveDate: $('#rStart').val(),
                expiredDate: $('#rEnd').val()
            };
            if (!body.firstPrice || !body.stepPrice || !body.effectiveDate || !body.expiredDate) {
                alert('请完整填写价卡信息'); return;
            }
            const url = id ? '/api/admin/rate-rules/' + id : '/api/admin/rate-rules';
            $.ajax({
                url: url, method: id ? 'PUT' : 'POST',
                contentType: 'application/json;charset=UTF-8',
                data: JSON.stringify(body), dataType: 'json'
            }).done(function (res) {
                if (res.code === 0) { showToast('保存成功', 'success'); $('#rModal').modal('hide'); loadRules(); }
                else { alert(res.msg); }
            });
        });

        loadChannels();
    });
</script>
</body>
</html>
