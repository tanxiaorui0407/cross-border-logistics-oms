<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>批量导入 - 跨境物流订单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-page="import">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">跨境物流 OMS</a>
        <ul class="navbar-nav me-auto" id="navLinks"></ul>
        <div id="navUser"></div>
    </div>
</nav>
<div class="container py-4" style="max-width:900px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Excel 批量导入订单</h5>
        <button class="btn btn-outline-secondary btn-sm" id="btnTemplate">下载导入模板</button>
    </div>
    <div class="card mb-3">
        <div class="card-body">
            <form class="row g-2 align-items-end" id="importForm">
                <div class="col-auto">
                    <input type="file" class="form-control" id="file" accept=".xlsx,.xls">
                </div>
                <div class="col-auto"><button class="btn btn-primary" id="btnUpload">上传并导入</button></div>
                <div class="col-auto text-muted small">导入成功的订单状态为「已提交」，失败行会给出错误报告</div>
            </form>
        </div>
    </div>
    <div id="resultCard" class="card d-none mb-3">
        <div class="card-body">
            <h6>导入结果</h6>
            <div class="mb-2">
                <span class="badge bg-secondary">共 {{total}}</span>
                <span class="badge bg-success">成功 {{success}}</span>
                <span class="badge bg-danger">失败 {{failed}}</span>
                <button class="btn btn-sm btn-outline-danger ms-2 d-none" id="btnErrReport">下载错误报告</button>
            </div>
            <table class="table table-sm table-bordered">
                <thead class="table-light"><tr><th style="width:90px">行号</th><th>错误原因</th></tr></thead>
                <tbody id="errBody"></tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    $(function () {
        if (!requireLogin()) return;
        $('#btnTemplate').on('click', function () {
            downloadAuth('/api/orders/import/template', '订单导入模板.xlsx');
        });
        $('#btnUpload').on('click', function (e) {
            e.preventDefault();
            const file = $('#file')[0].files[0];
            if (!file) { alert('请先选择 Excel 文件'); return; }
            const fd = new FormData();
            fd.append('file', file);
            $('#btnUpload').prop('disabled', true).text('导入中...');
            apiPostForm('/api/orders/import', fd).done(function (res) {
                if (res.code !== 0) { alert(res.msg); return; }
                const d = res.data;
                $('#resultCard').removeClass('d-none');
                $('#resultCard .badge.bg-secondary').text('共 ' + d.total);
                $('#resultCard .badge.bg-success').text('成功 ' + d.success);
                $('#resultCard .badge.bg-danger').text('失败 ' + d.failed);
                let html = '';
                (d.errors || []).forEach(e => {
                    html += `<tr><td>${e.rowNo}</td><td>${e.errorMsg}</td></tr>`;
                });
                $('#errBody').html(html || '<tr><td colspan="2" class="text-muted">全部导入成功</td></tr>');
                if (d.failed > 0) {
                    $('#btnErrReport').removeClass('d-none').off('click').on('click', function () {
                        downloadAuth('/api/orders/import/' + d.recordId + '/errors', '导入错误报告_' + d.recordId + '.xlsx');
                    });
                } else { $('#btnErrReport').addClass('d-none'); }
            }).fail(function () { alert('导入失败，请检查文件格式'); })
              .always(function () { $('#btnUpload').prop('disabled', false).text('上传并导入'); });
        });
    });
</script>
</body>
</html>
