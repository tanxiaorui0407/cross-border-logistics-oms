<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>渠道管理 - 跨境物流订单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-page="channels">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">跨境物流 OMS</a>
        <ul class="navbar-nav me-auto" id="navLinks"></ul>
        <div id="navUser"></div>
    </div>
</nav>
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">物流渠道管理</h5>
        <div>
            <a href="/admin/rates" class="btn btn-outline-secondary btn-sm me-2">价卡管理</a>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#chModal">新增渠道</button>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr><th>ID</th><th>编码</th><th>名称</th><th>运输类型</th><th>承运商</th><th>时效(天)</th><th>体积系数</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="chBody"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="chModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="chModalTitle">新增渠道</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="chId">
                <div class="mb-2"><label class="form-label">渠道编码</label><input class="form-control" id="chCode" placeholder="如 EXPRESS_2"></div>
                <div class="mb-2"><label class="form-label">渠道名称</label><input class="form-control" id="chName"></div>
                <div class="mb-2"><label class="form-label">运输类型</label>
                    <select class="form-select" id="chType">
                        <option value="EXPRESS">EXPRESS 国际快递</option>
                        <option value="POST">POST 邮政小包</option>
                        <option value="LINE">LINE 专线</option>
                    </select></div>
                <div class="mb-2"><label class="form-label">承运商</label><input class="form-control" id="chCarrier"></div>
                <div class="mb-2"><label class="form-label">参考时效（天）</label><input class="form-control" id="chEta" type="number" value="7"></div>
                <div class="mb-2"><label class="form-label">体积重系数（空运5000/专线8000）</label><input class="form-control" id="chDiv" type="number" value="5000"></div>
                <div class="mb-2"><label class="form-label">状态</label>
                    <select class="form-select" id="chStatus"><option value="1">启用</option><option value="0">停用</option></select></div>
            </div>
            <div class="modal-footer"><button class="btn btn-primary" id="btnSave">保存</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    $(function () {
        if (!requireLogin() || getUser().role !== 'ADMIN') { location.href = '/'; return; }
        let editingId = null;

        function load() {
            apiGet('/api/admin/channels', { page: 1, size: 100 }).done(function (res) {
                if (res.code !== 0) { alert(res.msg); return; }
                let html = '';
                (res.data.records || []).forEach(c => {
                    html += `<tr>
                        <td>${c.id}</td><td>${c.channelCode}</td><td>${c.channelName}</td>
                        <td>${c.transportType}</td><td>${c.carrier || '-'}</td>
                        <td>${c.etaDays}</td><td>${c.volDivisor}</td>
                        <td>${c.status === 1 ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-danger">停用</span>'}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="editCh(${c.id})">编辑</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="delCh(${c.id})">删除</button>
                        </td></tr>`;
                });
                $('#chBody').html(html || '<tr><td colspan="9" class="text-center text-muted">暂无渠道</td></tr>');
            });
        }

        window.editCh = function (id) {
            apiGet('/api/admin/channels', { page: 1, size: 100 }).done(function (res) {
                const c = (res.data.records || []).find(x => x.id === id);
                if (!c) return;
                editingId = id;
                $('#chId').val(id); $('#chCode').val(c.channelCode).prop('disabled', true);
                $('#chName').val(c.channelName); $('#chType').val(c.transportType);
                $('#chCarrier').val(c.carrier || ''); $('#chEta').val(c.etaDays);
                $('#chDiv').val(c.volDivisor); $('#chStatus').val(String(c.status));
                $('#chModalTitle').text('编辑渠道');
                new bootstrap.Modal($('#chModal')[0]).show();
            });
        };
        window.delCh = function (id) {
            if (!confirm('确认删除该渠道？')) return;
            $.ajax({ url: '/api/admin/channels/' + id, method: 'DELETE' }).done(function (res) {
                if (res.code === 0) { showToast('已删除', 'success'); load(); } else { alert(res.msg); }
            });
        };

        $('#chModal').on('show.bs.modal', function () {
            if (!editingId) {
                $('#chId').val(''); $('#chCode').val('').prop('disabled', false);
                $('#chName').val(''); $('#chType').val('EXPRESS'); $('#chCarrier').val('');
                $('#chEta').val(7); $('#chDiv').val(5000); $('#chStatus').val('1');
                $('#chModalTitle').text('新增渠道');
            }
        });
        $('#chModal').on('hidden.bs.modal', function () { editingId = null; });

        $('#btnSave').on('click', function () {
            const id = $('#chId').val();
            const body = {
                channelCode: $('#chCode').val().trim(),
                channelName: $('#chName').val().trim(),
                transportType: $('#chType').val(),
                carrier: $('#chCarrier').val().trim(),
                etaDays: Number($('#chEta').val() || 7),
                volDivisor: Number($('#chDiv').val() || 5000),
                currency: 'USD',
                status: Number($('#chStatus').val())
            };
            if (!body.channelCode || !body.channelName) { alert('编码/名称不能为空'); return; }
            const url = id ? '/api/admin/channels/' + id : '/api/admin/channels';
            $.ajax({
                url: url, method: id ? 'PUT' : 'POST',
                contentType: 'application/json;charset=UTF-8',
                data: JSON.stringify(body), dataType: 'json'
            }).done(function (res) {
                if (res.code === 0) { showToast('保存成功', 'success'); $('#chModal').modal('hide'); load(); }
                else { alert(res.msg); }
            });
        });
        load();
    });
</script>
</body>
</html>
